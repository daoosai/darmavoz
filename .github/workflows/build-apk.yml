name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: "2.4.5"
      RELEASE_VERSION_CODE: "245"
      APK_REMOTE_PATH: /opt/darmavoz/static/darmavoz.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Prepare release version
        working-directory: ./frontend
        run: |
          set -euo pipefail
          cat > .env.production <<EOF
          VITE_APP_VERSION=${RELEASE_VERSION}
          EOF

      - name: Install dependencies & Build Web
        working-directory: ./frontend
        run: |
          set -euo pipefail
          npm install
          npm install -D @capacitor/cli @capacitor/core @capacitor/android
          npm run build

      - name: Sync Capacitor
        working-directory: ./frontend
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Install dependencies & Build Web
        working-directory: ./frontend
        run: |
          set -euo pipefail
          npm install
          npm install -D @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
          npm run build

      - name: Generate Icons & Sync Capacitor
        working-directory: ./frontend
        run: |
          set -euo pipefail
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK (Debug)
        working-directory: ./frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          export DARMAVOZ_VERSION_NAME="${RELEASE_VERSION}"
          export DARMAVOZ_VERSION_CODE="${RELEASE_VERSION_CODE}"
          ./gradlew assembleDebug

      - name: Resolve APK path
        run: |
          set -euo pipefail
          ls -lah frontend/android/app/build/outputs/apk/debug
          APK_LOCAL_PATH="$(find frontend/android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort | head -n1)"
          test -n "${APK_LOCAL_PATH}"
          test -f "${APK_LOCAL_PATH}"
          echo "APK_LOCAL_PATH=${APK_LOCAL_PATH}" >> "${GITHUB_ENV}"

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload APK to Server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/github_actions_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p /opt/darmavoz/static && chmod 777 /opt/darmavoz/static"
          
          scp -i ~/.ssh/github_actions_key "${APK_LOCAL_PATH}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${APK_REMOTE_PATH}.tmp"
          
          ssh -i ~/.ssh/github_actions_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "set -e; mv '${APK_REMOTE_PATH}.tmp' '${APK_REMOTE_PATH}'; chmod 666 '${APK_REMOTE_PATH}'"
