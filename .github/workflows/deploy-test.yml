name: Deploy Test Environment

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  sprint22-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sprint22
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-only@localhost:5432/sprint22
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: isolated-ci-only-not-for-deployment
      ALGORITHM: HS256
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only
      AVITO_WEBHOOK_SECRET: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify migration and city isolation in disposable CI database
        run: python -m pytest -q tests/test_sprint22_unit.py tests/test_sprint22_api.py

  deploy-test:
    needs: sprint22-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derive frontend version
        working-directory: frontend
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "VITE_APP_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build frontend on runner
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_2GIS_KEY: ${{ secrets.VITE_2GIS_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          node --import tsx --test src/bulkCalculator.test.ts
          npm run build
          tar -C dist -cf ../frontend-dist.tar .

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Create incremental source bundle
        run: |
          set -euo pipefail
          ssh_opts=(
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          DEPLOY_BASE="$(ssh "${ssh_opts[@]}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'git -C /opt/darmavoz_test rev-parse HEAD')"
          if ! git merge-base --is-ancestor "${DEPLOY_BASE}" "${GITHUB_SHA}"; then
            echo "Server source commit is not an ancestor of ${GITHUB_SHA}" >&2
            exit 1
          fi
          git bundle create darmavoz-test.bundle HEAD "^${DEPLOY_BASE}"
          git bundle verify darmavoz-test.bundle

      - name: Upload deployment bundles
        run: |
          set -euo pipefail
          ssh_opts=(
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          cat frontend-dist.tar | ssh "${ssh_opts[@]}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cat > /tmp/frontend-dist.tar"
          cat darmavoz-test.bundle | ssh "${ssh_opts[@]}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cat > /tmp/darmavoz-test.bundle"
          sha256sum darmavoz-test.bundle | ssh "${ssh_opts[@]}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /tmp && sha256sum -c -"

      - name: Deploy staging on server
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'
          set -euo pipefail
          SOURCE_DIR=/opt/darmavoz_test
          DEPLOY_DIR=/opt/darmavoz_test_deploy

          cd "${SOURCE_DIR}"
          git bundle verify /tmp/darmavoz-test.bundle
          git fetch --no-tags /tmp/darmavoz-test.bundle HEAD
          DEPLOY_REF="$(git rev-parse FETCH_HEAD)"
          echo "Deploying commit ${DEPLOY_REF}"

          # Never discard local runtime changes or remove a worktree during deploy.
          if [ -d "${DEPLOY_DIR}/.git" ] || [ -f "${DEPLOY_DIR}/.git" ]; then
            if [ -n "$(git -C "${DEPLOY_DIR}" status --porcelain)" ]; then
              echo "Runtime has local changes; refusing to overwrite them" >&2
              exit 1
            fi
            git -C "${DEPLOY_DIR}" checkout --detach "${DEPLOY_REF}"
          else
            git worktree add --detach "${DEPLOY_DIR}" "${DEPLOY_REF}"
          fi

          echo "Runtime worktree commit $(git -C "${DEPLOY_DIR}" rev-parse HEAD)"

          if [ -f "${SOURCE_DIR}/.env" ]; then
            ln -sfn "${SOURCE_DIR}/.env" "${DEPLOY_DIR}/.env"
          fi

          mkdir -p /opt/daoos-kit/sites/darmavoz_test/frontend /opt/daoos-kit/sites/darmavoz_test/static
          tar -xf /tmp/frontend-dist.tar -C /opt/daoos-kit/sites/darmavoz_test/frontend
          cp -a "${DEPLOY_DIR}/static/." /opt/daoos-kit/sites/darmavoz_test/static/

          COMPOSE_FILE="${DEPLOY_DIR}/docker-compose.test.yml"

          # Сначала поднимаем инфраструктуру и собираем backend. Миграции должны
          # выполняться одним процессом, иначе PostgreSQL DDL может столкнуться
          # с параллельным запуском Alembic из entrypoint.sh.
          docker compose -f "${COMPOSE_FILE}" up -d db_test redis_test minio_test
          docker compose -f "${COMPOSE_FILE}" build \
            --build-arg APP_BUILD_COMMIT="${DEPLOY_REF}" \
            backend_test

          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' db_test 2>/dev/null || true)" = "healthy" ]; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Test database did not become healthy in time" >&2
              exit 1
            fi
            sleep 2
          done

          # Compose run по умолчанию подключает stdin контейнера и может поглотить
          # остаток SSH heredoc. /dev/null гарантирует продолжение deploy-скрипта.
          docker compose -f "${COMPOSE_FILE}" stop backend_test
          docker compose -f "${COMPOSE_FILE}" run --rm -T --no-deps --entrypoint alembic backend_test upgrade head </dev/null
          # Approved Sprint 22 initial test-market assignment, recorded once in DB.
          docker compose -f "${COMPOSE_FILE}" run --rm -T --no-deps --entrypoint python backend_test -m scripts.city_backfill --assign-all-existing-city-code tyumen --apply </dev/null
          docker compose -f "${COMPOSE_FILE}" up -d --no-deps --force-recreate backend_test
          docker compose -f "${COMPOSE_FILE}" restart backend_test

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs --tail 200 backend_test >&2 || true
              echo "Test backend did not become healthy in time" >&2
              exit 1
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8001/openapi.json", timeout=15) as response:
              openapi = json.load(response)

          required_sprint18_paths = {
              "/api/v1/cities/",
              "/api/v1/catalog/calculator/",
              "/api/v1/admin/placements/summary",
              "/api/v1/system/placement-policy",
              "/api/v1/supplier/points/{point_id}/confirm-relevance",
          }
          missing_paths = required_sprint18_paths.difference(openapi["paths"])
          if missing_paths:
              raise SystemExit(
                  f"Sprint 18 routes are missing after deploy: {sorted(missing_paths)}"
              )

          quarry_create = openapi["components"]["schemas"]["QuarryCreate"]
          required_fields = set(quarry_create.get("required", []))
          if "lat" in required_fields or "lon" in required_fields:
              raise SystemExit(
                  f"QuarryCreate still requires coordinates after deploy: {sorted(required_fields)}"
              )
          PY
          EOF
