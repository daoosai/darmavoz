name: Build iOS Simulator App

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/build-ios-simulator.yml'
  workflow_dispatch: # Запуск вручную из вкладки Actions

jobs:
  build-ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      - name: Build for iOS Simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath ios/build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Zip Simulator App
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r App.app.zip App.app

      - name: Upload Artifact for Appetize
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: frontend/ios/build/Build/Products/Debug-iphonesimulator/App.app.zip
