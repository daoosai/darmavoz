name: Deploy Production Environment

on:
  workflow_run:
    workflows:
      - Build Android APK
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-prod:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derive frontend version
        working-directory: frontend
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "VITE_APP_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_2GIS_KEY: ${{ secrets.VITE_2GIS_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          tar -C dist -cf ../frontend-prod.tar .

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload frontend bundle
        run: |
          set -euo pipefail
          scp -i ~/.ssh/github_actions_key frontend-prod.tar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/frontend-prod.tar"

      - name: Deploy backend and frontend to Production
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/github_actions_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'
          set -euo pipefail
          SOURCE_DIR=/opt/darmavoz
          DEPLOY_DIR=/opt/darmavoz_deploy

          cd "${SOURCE_DIR}"
          git fetch origin main

          # Обновляем Worktree
          git worktree prune || true
          if git worktree list | grep -q "${DEPLOY_DIR}"; then
            git -C "${DEPLOY_DIR}" fetch origin main
            git -C "${DEPLOY_DIR}" checkout --detach origin/main
          else
            rm -rf "${DEPLOY_DIR}"
            git worktree add --detach "${DEPLOY_DIR}" origin/main
          fi

          # Линкуем боевой .env
          if [ -f "${SOURCE_DIR}/.env" ]; then
            ln -sfn "${SOURCE_DIR}/.env" "${DEPLOY_DIR}/.env"
          fi

          # Распаковка Frontend и публикация APK
          mkdir -p /opt/daoos-kit/sites/darmavoz/frontend /opt/daoos-kit/sites/darmavoz/static "${DEPLOY_DIR}/static"
          rm -rf /opt/daoos-kit/sites/darmavoz/frontend/*
          tar -xf /tmp/frontend-prod.tar -C /opt/daoos-kit/sites/darmavoz/frontend
          rm -f /tmp/frontend-prod.tar
          cp -a "${DEPLOY_DIR}/static/." /opt/daoos-kit/sites/darmavoz/static/

          # Обновление Backend и Миграции
          docker compose -f "${DEPLOY_DIR}/docker-compose.yml" up -d --build --force-recreate backend

          # Ожидание старта и накатывание миграций
          sleep 5
          docker exec darmavoz_backend alembic upgrade head
          EOF
