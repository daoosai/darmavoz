services:
  db:
    image: postgres:15-alpine
    container_name: darmavoz_db_local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: darmavoz
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: darmavoz_redis_local
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: darmavoz_backend_local
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
