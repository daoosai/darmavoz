name: Build Test Android APK

on:
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    env:
      APK_REMOTE_DIR: /opt/daoos-kit/sites/darmavoz_test/static
      APK_REMOTE_NAME: darmavoz-test.apk
      APK_BUILD_PATH: frontend/android/app/build/outputs/apk/debug/app-debug.apk
      VITE_2GIS_KEY: ${{ secrets.VITE_2GIS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Derive release version
        working-directory: frontend
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -p "require('./package.json').version.replace(/\./g, '')")"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm install -D @capacitor/android
          npm run version:sync

      - name: Prepare test environment (Vite & Capacitor)
        working-directory: frontend
        run: |
          set -euo pipefail
          cat > .env.production <<EOF
          VITE_API_BASE_URL=https://test.darmavoz.ru/api/v1
          VITE_API_URL=https://test.darmavoz.ru/api/v1
          VITE_S3_URL=https://test.darmavoz.ru/s3
          VITE_APP_VERSION=${RELEASE_VERSION}
          EOF

          # Override app id only inside CI for the test APK package name.
          sed -i 's/ru\.darmavoz\.app/com.darmavoz.app.test/g' capacitor.config.ts || true
          sed -i 's/ru\.darmavoz\.app/com.darmavoz.app.test/g' capacitor.config.json || true

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate Android assets and sync project
        working-directory: frontend
        run: |
          set -euo pipefail
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Apply test Android branding
        working-directory: frontend
        run: |
          set -euo pipefail
          sed -i 's/applicationId "com\.darmavoz\.app"/applicationId "com.darmavoz.app.test"/' android/app/build.gradle
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Тест Дармавоз</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Тест Дармавоз</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="package_name">com\.darmavoz\.app</string>#<string name="package_name">com.darmavoz.app.test</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="custom_url_scheme">com\.darmavoz\.app</string>#<string name="custom_url_scheme">com.darmavoz.app.test</string>#' android/app/src/main/res/values/strings.xml

      - name: Setup Firebase for Test APK
        working-directory: frontend
        env:
          GOOGLE_SERVICES_JSON_TEST: ${{ secrets.GOOGLE_SERVICES_JSON_TEST }}
        run: echo "$GOOGLE_SERVICES_JSON_TEST" > android/app/google-services.json

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          export DARMAVOZ_VERSION_NAME="${RELEASE_VERSION}"
          export DARMAVOZ_VERSION_CODE="${RELEASE_VERSION_CODE}"
          ./gradlew assembleDebug

      - name: Prepare remote APK directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST || secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME || secrets.SSH_USER }}
          key: ${{ secrets.PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          envs: APK_REMOTE_DIR
          script: |
            set -euo pipefail
            mkdir -p "${APK_REMOTE_DIR}"

      - name: Upload APK directly to server via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST || secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME || secrets.SSH_USER }}
          key: ${{ secrets.PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.APK_BUILD_PATH }}"
          target: "/opt/daoos-kit/sites/darmavoz_test/static/"
          strip_components: 7
          overwrite: true

      - name: Rename APK on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST || secrets.SSH_HOST }}
          username: ${{ secrets.USERNAME || secrets.SSH_USER }}
          key: ${{ secrets.PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            mv /opt/daoos-kit/sites/darmavoz_test/static/app-debug.apk /opt/daoos-kit/sites/darmavoz_test/static/darmavoz-test.apk
