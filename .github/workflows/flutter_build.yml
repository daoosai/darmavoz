name: Build Flutter APK

on:
  push:
    branches:
      - main
      - 'feature/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Client APK
        working-directory: ./mobile
        run: flutter build apk --release --flavor client -t lib/main_client.dart

      - name: Build Driver APK
        working-directory: ./mobile
        run: flutter build apk --release --flavor driver -t lib/main_driver.dart

      - name: Upload Client APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-client-release
          path: mobile/build/app/outputs/flutter-apk/app-client-release.apk

      - name: Upload Driver APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-driver-release
          path: mobile/build/app/outputs/flutter-apk/app-driver-release.apk
