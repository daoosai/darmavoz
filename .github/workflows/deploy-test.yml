name: Deploy Test Environment

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend on runner
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          tar -C dist -cf ../frontend-dist.tar .

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload frontend bundle
        run: |
          set -euo pipefail
          scp -i ~/.ssh/github_actions_key frontend-dist.tar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/frontend-dist.tar"

      - name: Deploy staging on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/github_actions_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'
          set -euo pipefail
          SOURCE_DIR=/opt/darmavoz_test
          DEPLOY_DIR=/opt/darmavoz_test_deploy

          cd "${SOURCE_DIR}"
          git fetch origin develop

          # САМОИСЦЕЛЕНИЕ GIT WORKTREE (Убиваем зомби-папки)
          git worktree prune || true
          if git worktree list | grep -q "${DEPLOY_DIR}"; then
            git -C "${DEPLOY_DIR}" fetch origin develop
            git -C "${DEPLOY_DIR}" checkout --detach origin/develop
          else
            rm -rf "${DEPLOY_DIR}"
            git worktree add --detach "${DEPLOY_DIR}" origin/develop
          fi

          if [ -f "${SOURCE_DIR}/.env" ]; then
            ln -sfn "${SOURCE_DIR}/.env" "${DEPLOY_DIR}/.env"
          fi

          mkdir -p /opt/daoos-kit/sites/darmavoz_test/frontend /opt/daoos-kit/sites/darmavoz_test/static
          rm -rf /opt/daoos-kit/sites/darmavoz_test/frontend/*
          tar -xf /tmp/frontend-dist.tar -C /opt/daoos-kit/sites/darmavoz_test/frontend
          rm -f /tmp/frontend-dist.tar
          cp -a "${DEPLOY_DIR}/static/." /opt/daoos-kit/sites/darmavoz_test/static/

          # УБИВАЕМ ЗАВИСШИЕ КОНТЕЙНЕРЫ
          docker rm -f minio_test db_test redis_test backend_test || true

          # ПОДНИМАЕМ ЗАНОВО
          docker compose -f "${DEPLOY_DIR}/docker-compose.test.yml" up -d db_test redis_test minio_test backend_test --build --force-recreate
          docker exec backend_test alembic upgrade head
          EOF
