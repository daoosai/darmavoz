<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Управление каталогом</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(59,130,246,0.22),_transparent_35%),radial-gradient(circle_at_bottom,_rgba(16,185,129,0.16),_transparent_30%)]"></div>

  <main class="relative mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="mb-6 flex flex-col gap-4 rounded-3xl border border-white/10 bg-slate-900/75 p-6 shadow-xl shadow-slate-950/40 backdrop-blur">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-sm font-medium uppercase tracking-[0.3em] text-blue-300">Спринт 6</p>
          <h1 class="mt-2 text-3xl font-semibold text-white">Админ-панель: Каталог материалов</h1>
        </div>
        <div class="flex items-center gap-3">
          <button id="logoutButton" class="rounded-2xl border border-white/10 bg-slate-800 px-4 py-2 text-sm text-slate-200 transition hover:bg-slate-700">Выйти</button>
        </div>
      </div>
    </header>

    <section class="grid gap-6 lg:grid-cols-3">
      <!-- Форма добавления материала -->
      <article class="lg:col-span-1 rounded-3xl border border-white/10 bg-slate-900/75 p-6 shadow-xl shadow-slate-950/40 backdrop-blur self-start">
        <h2 class="text-xl font-semibold text-white mb-4">Добавить материал</h2>
        <form id="addMaterialForm" class="space-y-4">
          <div>
            <label class="block text-sm text-slate-300 mb-1">Название</label>
            <input id="matName" required class="w-full rounded-2xl border border-white/10 bg-slate-800 px-4 py-2 text-white outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30">
          </div>
          <div>
            <label class="block text-sm text-slate-300 mb-1">Категория (ID)</label>
            <input id="matCategory" required class="w-full rounded-2xl border border-white/10 bg-slate-800 px-4 py-2 text-white outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/30" placeholder="UUID">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm text-slate-300 mb-1">Цена (₽)</label>
              <input id="matPrice" type="number" step="0.01" required class="w-full rounded-2xl border border-white/10 bg-slate-800 px-4 py-2 text-white outline-none transition focus:border-blue-400">
            </div>
            <div>
              <label class="block text-sm text-slate-300 mb-1">Ед. изм.</label>
              <input id="matUnit" required class="w-full rounded-2xl border border-white/10 bg-slate-800 px-4 py-2 text-white outline-none transition focus:border-blue-400" placeholder="м3, шт, т">
            </div>
          </div>
          <div>
            <label class="block text-sm text-slate-300 mb-1">Мин. объем</label>
            <input id="matMinVolume" type="number" step="0.1" value="1.0" required class="w-full rounded-2xl border border-white/10 bg-slate-800 px-4 py-2 text-white outline-none transition focus:border-blue-400">
          </div>
          <div>
            <label class="block text-sm text-slate-300 mb-1">URL картинки</label>
            <input id="matImage" class="w-full rounded-2xl border border-white/10 bg-slate-800 px-4 py-2 text-white outline-none transition focus:border-blue-400">
          </div>
          <button type="submit" class="w-full rounded-2xl bg-blue-500 px-4 py-3 font-semibold text-white transition hover:bg-blue-400">Добавить</button>
        </form>
      </article>

      <!-- Список материалов -->
      <article class="lg:col-span-2 rounded-3xl border border-white/10 bg-slate-900/75 p-6 shadow-xl shadow-slate-950/40 backdrop-blur">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-semibold text-white">Все материалы</h2>
          <button id="refreshMaterialsButton" class="rounded-2xl bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-emerald-400">Обновить список</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-800/50 text-slate-400">
              <tr>
                <th class="px-4 py-3 font-medium">Название</th>
                <th class="px-4 py-3 font-medium">Цена</th>
                <th class="px-4 py-3 font-medium">Ед. изм</th>
                <th class="px-4 py-3 font-medium">Статус</th>
                <th class="px-4 py-3 font-medium">Действия</th>
              </tr>
            </thead>
            <tbody id="materialsList" class="divide-y divide-white/10">
              <!-- Materials will be loaded here -->
            </tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script>
    const TOKEN_KEY = "jwt_token";
    const API_ADMIN_MATERIALS_URL = "/api/v1/admin/materials/";

    document.addEventListener("DOMContentLoaded", () => {
      const savedToken = localStorage.getItem(TOKEN_KEY);
      if (!savedToken) {
        window.location.href = "/demo"; // Redirect to login if not authorized
        return;
      }
      loadMaterials();
    });

    document.getElementById("logoutButton").addEventListener("click", () => {
      localStorage.removeItem(TOKEN_KEY);
      window.location.href = "/demo";
    });

    document.getElementById("refreshMaterialsButton").addEventListener("click", loadMaterials);

    document.getElementById("addMaterialForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const token = localStorage.getItem(TOKEN_KEY);
      const payload = {
        name: document.getElementById("matName").value,
        category_id: document.getElementById("matCategory").value,
        price: parseFloat(document.getElementById("matPrice").value),
        unit: document.getElementById("matUnit").value,
        min_volume: parseFloat(document.getElementById("matMinVolume").value),
        image_url: document.getElementById("matImage").value || null,
        is_active: true
      };

      try {
        const response = await fetch(API_ADMIN_MATERIALS_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error("Ошибка добавления материала");
        e.target.reset();
        loadMaterials();
      } catch (err) {
        alert(err.message);
      }
    });

    async function loadMaterials() {
      const token = localStorage.getItem(TOKEN_KEY);
      try {
        const response = await fetch(API_ADMIN_MATERIALS_URL, {
          headers: { "Authorization": "Bearer " + token }
        });
        if (!response.ok) throw new Error("Ошибка загрузки материалов");
        
        const materials = await response.json();
        renderMaterials(materials);
      } catch (err) {
        console.error(err);
      }
    }

    async function toggleActiveStatus(id, currentStatus) {
      const token = localStorage.getItem(TOKEN_KEY);
      try {
        const response = await fetch(API_ADMIN_MATERIALS_URL + id, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ is_active: !currentStatus })
        });
        if (!response.ok) throw new Error("Ошибка обновления статуса");
        loadMaterials();
      } catch (err) {
        alert(err.message);
      }
    }

    function renderMaterials(materials) {
      const list = document.getElementById("materialsList");
      list.innerHTML = materials.map(m => `
        <tr class="hover:bg-slate-800/30 transition">
          <td class="px-4 py-3">${m.name}</td>
          <td class="px-4 py-3">${m.price} ₽</td>
          <td class="px-4 py-3">${m.unit}</td>
          <td class="px-4 py-3">
            <span class="inline-flex rounded-full px-2 py-1 text-xs font-medium ${m.is_active ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}">
              ${m.is_active ? 'Активен' : 'Скрыт'}
            </span>
          </td>
          <td class="px-4 py-3">
            <button onclick="toggleActiveStatus('${m.id}', ${m.is_active})" class="text-xs rounded border border-slate-600 px-3 py-1 hover:bg-slate-700 transition">
              ${m.is_active ? 'Деактивировать' : 'Активировать'}
            </button>
          </td>
        </tr>
      `).join("");
    }
  </script>
</body>
</html>
