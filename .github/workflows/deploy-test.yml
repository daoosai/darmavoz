name: Deploy Test Environment

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derive frontend version
        working-directory: frontend
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "VITE_APP_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build frontend on runner
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_2GIS_KEY: ${{ secrets.VITE_2GIS_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          tar -C dist -cf ../frontend-dist.tar .

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload frontend bundle
        run: |
          set -euo pipefail
          ssh_opts=(
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          cat frontend-dist.tar | ssh "${ssh_opts[@]}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cat > /tmp/frontend-dist.tar"

      - name: Deploy staging on server
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'
          set -euo pipefail
          SOURCE_DIR=/opt/darmavoz_test
          DEPLOY_DIR=/opt/darmavoz_test_deploy

          cd "${SOURCE_DIR}"
          git fetch origin develop
          DEPLOY_REF="$(git rev-parse FETCH_HEAD)"
          echo "Deploying commit ${DEPLOY_REF}"

          # САМОИСЦЕЛЕНИЕ GIT WORKTREE (Убиваем зомби-папки)
          git worktree prune || true
          if git worktree list | grep -q "${DEPLOY_DIR}"; then
            git -C "${DEPLOY_DIR}" fetch origin develop
            if [ -n "$(git -C "${DEPLOY_DIR}" status --porcelain)" ]; then
              git worktree remove --force "${DEPLOY_DIR}" || true
              rm -rf "${DEPLOY_DIR}"
              git worktree prune || true
              git worktree add --detach "${DEPLOY_DIR}" "${DEPLOY_REF}"
            else
              git -C "${DEPLOY_DIR}" checkout --detach "${DEPLOY_REF}"
            fi
          else
            rm -rf "${DEPLOY_DIR}"
            git worktree add --detach "${DEPLOY_DIR}" "${DEPLOY_REF}"
          fi

          echo "Runtime worktree commit $(git -C "${DEPLOY_DIR}" rev-parse HEAD)"

          if [ -f "${SOURCE_DIR}/.env" ]; then
            ln -sfn "${SOURCE_DIR}/.env" "${DEPLOY_DIR}/.env"
          fi

          mkdir -p /opt/daoos-kit/sites/darmavoz_test/frontend /opt/daoos-kit/sites/darmavoz_test/static
          rm -rf /opt/daoos-kit/sites/darmavoz_test/frontend/*
          tar -xf /tmp/frontend-dist.tar -C /opt/daoos-kit/sites/darmavoz_test/frontend
          rm -f /tmp/frontend-dist.tar
          cp -a "${DEPLOY_DIR}/static/." /opt/daoos-kit/sites/darmavoz_test/static/

          # УБИВАЕМ ЗАВИСШИЕ КОНТЕЙНЕРЫ
          docker rm -f minio_test db_test redis_test || true

          COMPOSE_FILE="${DEPLOY_DIR}/docker-compose.test.yml"

          # Сначала поднимаем инфраструктуру и собираем backend. Миграции должны
          # выполняться одним процессом, иначе PostgreSQL DDL может столкнуться
          # с параллельным запуском Alembic из entrypoint.sh.
          docker compose -f "${COMPOSE_FILE}" up -d db_test redis_test minio_test --force-recreate
          docker compose -f "${COMPOSE_FILE}" build \
            --build-arg APP_BUILD_COMMIT="${DEPLOY_REF}" \
            backend_test

          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' db_test 2>/dev/null || true)" = "healthy" ]; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Test database did not become healthy in time" >&2
              exit 1
            fi
            sleep 2
          done

          # Без -T compose подключает stdin контейнера и поглощает остаток SSH heredoc,
          # поэтому restart и smoke-check ниже не выполняются.
          docker compose -f "${COMPOSE_FILE}" run --rm -T --no-deps --entrypoint alembic backend_test upgrade heads
          docker rm -f backend_test || true
          docker compose -f "${COMPOSE_FILE}" up -d --no-deps --force-recreate backend_test
          docker compose -f "${COMPOSE_FILE}" restart backend_test

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8001/health >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs --tail 200 backend_test >&2 || true
              echo "Test backend did not become healthy in time" >&2
              exit 1
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8001/openapi.json", timeout=15) as response:
              openapi = json.load(response)

          required_sprint18_paths = {
              "/api/v1/admin/placements/summary",
              "/api/v1/system/placement-policy",
              "/api/v1/supplier/points/{point_id}/confirm-relevance",
          }
          missing_paths = required_sprint18_paths.difference(openapi["paths"])
          if missing_paths:
              raise SystemExit(
                  f"Sprint 18 routes are missing after deploy: {sorted(missing_paths)}"
              )

          quarry_create = openapi["components"]["schemas"]["QuarryCreate"]
          required_fields = set(quarry_create.get("required", []))
          if "lat" in required_fields or "lon" in required_fields:
              raise SystemExit(
                  f"QuarryCreate still requires coordinates after deploy: {sorted(required_fields)}"
              )
          PY
          EOF
