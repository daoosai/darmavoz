services:
  db_test:
    image: postgres:16-alpine
    container_name: db_test
    restart: always
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB}
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER} -d ${TEST_POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - daoos_kit_default

  redis_test:
    image: redis:7-alpine
    container_name: redis_test
    restart: always
    command: ["redis-server", "--appendonly", "no", "--requirepass", "${TEST_REDIS_PASSWORD}"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${TEST_REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - daoos_kit_default

  minio_test:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio_test
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data_test:/data
    networks:
      daoos_kit_default:
        aliases:
          - minio-test

  backend_test:
    build: .
    container_name: backend_test
    restart: always
    env_file:
      - .env
    environment:
      S3_ENDPOINT: http://minio-test:9000
      S3_PUBLIC_BASE_URL: https://test.darmavoz.ru
      S3_PRESIGN_ENDPOINT: https://test.darmavoz.ru/s3
    depends_on:
      db_test:
        condition: service_healthy
      redis_test:
        condition: service_healthy
      minio_test:
        condition: service_started
    ports:
      - "8001:8000"
    networks:
      - daoos_kit_default

networks:
  daoos_kit_default:
    external: true

volumes:
  postgres_data_test:
  minio_data_test:
