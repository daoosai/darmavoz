name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      VITE_2GIS_KEY: ${{ secrets.VITE_2GIS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Derive release version
        working-directory: frontend
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -p "require('./package.json').version.replace(/\./g, '')")"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm install -D @capacitor/android
          npm run version:sync

      - name: Prepare production environment
        working-directory: frontend
        run: |
          set -euo pipefail
          cat > .env.production <<EOF
          VITE_API_BASE_URL=https://darmavoz.ru/api/v1
          VITE_API_URL=https://darmavoz.ru/api/v1
          VITE_S3_URL=https://darmavoz.ru/s3
          VITE_APP_VERSION=${RELEASE_VERSION}
          EOF

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate Android assets and sync project
        working-directory: frontend
        run: |
          set -euo pipefail
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          export DARMAVOZ_VERSION_NAME="${RELEASE_VERSION}"
          export DARMAVOZ_VERSION_CODE="${RELEASE_VERSION_CODE}"
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/darmavoz.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darmavoz-apk
          path: darmavoz.apk
          if-no-files-found: error
