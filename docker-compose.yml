version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: darmavoz_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: darmavoz
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: darmavoz_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: darmavoz_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/darmavoz
      - REDIS_URL=redis://redis:6379/0
