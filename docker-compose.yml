services:
  db:
    image: postgres:15-alpine
    container_name: darmavoz_db
    restart: always
    profiles: ["local"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: darmavoz
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: darmavoz_redis
    restart: always
    profiles: ["local"]
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: darmavoz_backend
    restart: always
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - default
      - daoos_kit_default

networks:
  daoos_kit_default:
    external: true
