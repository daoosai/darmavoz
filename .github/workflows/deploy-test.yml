name: Deploy Test Environment

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend on runner
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          tar -C dist -cf ../frontend-dist.tar .

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload frontend bundle
        run: |
          set -euo pipefail
          scp -i ~/.ssh/github_actions_key frontend-dist.tar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/frontend-dist.tar"

      - name: Deploy staging on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/github_actions_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'
          set -euo pipefail
          cd /opt/darmavoz_test
          git fetch origin develop
          git checkout develop
          git restore --source=HEAD --worktree --staged -- docker-compose.test.yml
          git pull --ff-only origin develop

          mkdir -p /opt/daoos-kit/sites/darmavoz_test/frontend /opt/daoos-kit/sites/darmavoz_test/static
          rm -rf /opt/daoos-kit/sites/darmavoz_test/frontend/*
          tar -xf /tmp/frontend-dist.tar -C /opt/daoos-kit/sites/darmavoz_test/frontend
          rm -f /tmp/frontend-dist.tar
          cp -a static/. /opt/daoos-kit/sites/darmavoz_test/static/

          docker compose -f docker-compose.test.yml up -d db_test redis_test minio_test backend_test --build
          docker exec backend_test alembic upgrade head
          EOF
