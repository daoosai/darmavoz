name: Build Test Android APK

on:
  push:
    branches:
      - develop

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: "2.4.5"
      RELEASE_VERSION_CODE: "245"
      APK_REMOTE_DIR: /opt/darmavoz_test/backend/static
      APK_REMOTE_NAME: darmavoz-test.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install
          npm install -D @capacitor/android @capacitor/assets

      - name: Prepare test environment (Vite & Capacitor)
        working-directory: frontend
        run: |
          set -euo pipefail
          # Создаем .env.production, чтобы Vite гарантированно подхватил тестовые ссылки!
          cat > .env.production <<EOF
          VITE_API_BASE_URL=https://test.darmavoz.ru/api/v1
          VITE_API_URL=https://test.darmavoz.ru/api/v1
          VITE_S3_URL=https://test.darmavoz.ru/s3
          VITE_APP_VERSION=${RELEASE_VERSION}
          EOF
          
          # Меняем App ID прямо в конфиге Capacitor ДО синхронизации
          sed -i 's/com\.darmavoz\.app/com.darmavoz.app.test/g' capacitor.config.ts || true
          sed -i 's/com\.darmavoz\.app/com.darmavoz.app.test/g' capacitor.config.json || true

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate Android assets and sync project
        working-directory: frontend
        run: |
          set -euo pipefail
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Setup Firebase for Test APK
        working-directory: frontend
        env:
          GOOGLE_SERVICES_JSON_TEST: ${{ secrets.GOOGLE_SERVICES_JSON_TEST }}
        # Кладем JSON только ПОСЛЕ sync, когда папка android/app уже гарантированно готова
        run: echo "$GOOGLE_SERVICES_JSON_TEST" > android/app/google-services.json

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          export DARMAVOZ_VERSION_NAME="${RELEASE_VERSION}"
          export DARMAVOZ_VERSION_CODE="${RELEASE_VERSION_CODE}"
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ${{ github.workspace }}/darmavoz-test.apk

      - name: Prepare remote APK directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/darmavoz_test/backend/static
            mkdir -p /opt/daoos-kit/sites/darmavoz_test/static

      - name: Copy APK to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "darmavoz-test.apk"
          target: "/opt/darmavoz_test/backend/static/"

      - name: Publish APK to test static
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cp /opt/darmavoz_test/backend/static/darmavoz-test.apk /opt/daoos-kit/sites/darmavoz_test/static/darmavoz-test.apk
