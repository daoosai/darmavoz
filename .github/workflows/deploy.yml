name: Deploy Production Environment

on:
  workflow_run:
    workflows:
      - Build Android APK
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-prod:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Derive frontend version
        working-directory: frontend
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "VITE_APP_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_2GIS_KEY: ${{ secrets.VITE_2GIS_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          tar -C dist -cf ../frontend-prod.tar .

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Create incremental source bundle
        run: |
          set -euo pipefail
          ssh_opts=(
            -i ~/.ssh/github_actions_key
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          DEPLOY_BASE="$(ssh "${ssh_opts[@]}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'git -C /opt/darmavoz rev-parse HEAD')"
          if ! git merge-base --is-ancestor "${DEPLOY_BASE}" HEAD; then
            echo "Server source commit is not an ancestor of the deployment commit" >&2
            exit 1
          fi
          git bundle create darmavoz-prod.bundle HEAD "^${DEPLOY_BASE}"
          git bundle verify darmavoz-prod.bundle

      - name: Upload deployment bundles
        run: |
          set -euo pipefail
          ssh_opts=(
            -i ~/.ssh/github_actions_key
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          cat frontend-prod.tar | ssh "${ssh_opts[@]}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cat > /tmp/frontend-prod.tar"
          cat darmavoz-prod.bundle | ssh "${ssh_opts[@]}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cat > /tmp/darmavoz-prod.bundle"
          sha256sum darmavoz-prod.bundle | ssh "${ssh_opts[@]}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /tmp && sha256sum -c -"

      - name: Deploy backend and frontend to Production
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/github_actions_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'
          set -euo pipefail
          SOURCE_DIR=/opt/darmavoz
          DEPLOY_DIR=/opt/darmavoz_deploy

          cd "${SOURCE_DIR}"
          git bundle verify /tmp/darmavoz-prod.bundle
          git fetch --no-tags /tmp/darmavoz-prod.bundle HEAD
          DEPLOY_REF="$(git rev-parse FETCH_HEAD)"
          echo "Deploying commit ${DEPLOY_REF}"

          # Обновляем Worktree
          git worktree prune || true
          if git worktree list | grep -q "${DEPLOY_DIR}"; then
            git -C "${DEPLOY_DIR}" reset --hard "${DEPLOY_REF}"
            git -C "${DEPLOY_DIR}" checkout --detach "${DEPLOY_REF}"
          else
            git worktree add --detach "${DEPLOY_DIR}" "${DEPLOY_REF}"
          fi

          echo "Runtime worktree commit $(git -C "${DEPLOY_DIR}" rev-parse HEAD)"

          # Линкуем боевой .env
          if [ -f "${SOURCE_DIR}/.env" ]; then
            ln -sfn "${SOURCE_DIR}/.env" "${DEPLOY_DIR}/.env"
          fi

          COMPOSE_FILE="${DEPLOY_DIR}/docker-compose.yml"

          # Распаковка Frontend и публикация APK
          mkdir -p /opt/daoos-kit/sites/darmavoz/frontend /opt/daoos-kit/sites/darmavoz/static "${DEPLOY_DIR}/static"
          rm -rf /opt/daoos-kit/sites/darmavoz/frontend/*
          tar -xf /tmp/frontend-prod.tar -C /opt/daoos-kit/sites/darmavoz/frontend
          rm -f /tmp/frontend-prod.tar
          cp -a "${DEPLOY_DIR}/static/." /opt/daoos-kit/sites/darmavoz/static/

          # Обновление Backend и Миграции
          docker compose -f "${COMPOSE_FILE}" build backend

          # Сначала прогоняем Alembic отдельным контейнером, затем пересоздаём runtime backend
          docker compose -f "${COMPOSE_FILE}" run --rm --no-deps --entrypoint alembic backend upgrade head
          docker rm -f darmavoz_backend || true
          docker compose -f "${COMPOSE_FILE}" up -d --no-deps --force-recreate backend
          EOF
