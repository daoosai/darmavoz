name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      APK_REMOTE_DIR: /opt/darmavoz_deploy/static
      APK_BUILD_PATH: frontend/android/app/build/outputs/apk/debug/app-debug.apk
      VITE_2GIS_KEY: ${{ secrets.VITE_2GIS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Derive release version
        working-directory: frontend
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -p "require('./package.json').version.replace(/\./g, '')")"
          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm install -D @capacitor/android
          npm run version:sync

      - name: Prepare production environment
        working-directory: frontend
        run: |
          set -euo pipefail
          cat > .env.production <<EOF
          VITE_API_BASE_URL=https://darmavoz.ru/api/v1
          VITE_API_URL=https://darmavoz.ru/api/v1
          VITE_S3_URL=https://darmavoz.ru/s3
          VITE_APP_VERSION=${RELEASE_VERSION}
          EOF

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate Android assets and sync project
        working-directory: frontend
        run: |
          set -euo pipefail
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          export DARMAVOZ_VERSION_NAME="${RELEASE_VERSION}"
          export DARMAVOZ_VERSION_CODE="${RELEASE_VERSION_CODE}"
          ./gradlew assembleDebug

      - name: Decode Android release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > frontend/android/app/darmavoz-release.keystore
          chmod 600 frontend/android/app/darmavoz-release.keystore

      - name: Build signed Android App Bundle
        working-directory: frontend/android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/frontend/android/app/darmavoz-release.keystore
          KEYSTORE_PASSWORD: darmavoz2026
          KEY_ALIAS: darmavoz
          KEY_PASSWORD: darmavoz2026
          DARMAVOZ_VERSION_NAME: ${{ env.RELEASE_VERSION }}
          DARMAVOZ_VERSION_CODE: ${{ env.RELEASE_VERSION_CODE }}
        run: |
          set -euo pipefail
          ./gradlew bundleRelease

      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: darmavoz-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Prepare remote APK directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APK_REMOTE_DIR
          script: |
            set -euo pipefail
            mkdir -p "${APK_REMOTE_DIR}"

      - name: Upload APK directly to server via SCP
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ env.APK_BUILD_PATH }}"
          target: "/opt/darmavoz_deploy/static/"
          strip_components: 7
          overwrite: true

      - name: Rename APK on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            mv /opt/darmavoz_deploy/static/app-debug.apk /opt/darmavoz_deploy/static/darmavoz.apk
            cd /opt/darmavoz_deploy
            docker compose up -d --build backend
