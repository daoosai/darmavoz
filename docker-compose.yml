services:
  backend:
    build: .
    container_name: darmavoz_backend
    restart: always
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - daoos_kit_default

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: always
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - /opt/minio/data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - daoos_kit_default

networks:
  daoos_kit_default:
    external: true
